const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanWord=s=>s.toLowerCase().replace(/[^a-z'-]/g,'').replace(/^'+|'+$/g,'');
const clock=s=>Math.floor(s/60).toString().padStart(2,'0')+':'+Math.floor(s%60).toString().padStart(2,'0');
let db=null,records=[],session=null,stage='read',selected=null,rate=1,fontSize=20,showMeaning=false,showTranslation=false,speechToken=0,speechQueue=[],speechIndex=0,speechPaused=false,currentUtterance=null,recording=null,requestingMic=false,mediaStream=null,audioContext=null,analyser=null,levelFrame=null,recordedSeconds=0,segmentStarted=0,afterStop=null,storageOkay=true,toastTimer,deleteId=null,parentRecordId=null;
const audioUrls=new Map();
function notify(message){$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',6000)}
function makeSession(sample=false){return{id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),article:ARTICLE.id,created:new Date().toISOString(),recordings:[],marks:{},listens:[],translations:[],practices:[],status:'draft',sample,answer:null,answerHelp:false,rating:null,activeSeconds:0}}
function isRecording(){return recording&&recording.state==='recording'}
function isPaused(){return recording&&recording.state==='paused'}
function busy(){return isRecording()||isPaused()||requestingMic}
function openDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('IndexedDB unavailable'));const req=indexedDB.open('tuwei-reading-demo',1);req.onupgradeneeded=()=>req.result.createObjectStore('sessions',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function transact(mode,work){return new Promise((resolve,reject)=>{const tx=db.transaction('sessions',mode);const req=work(tx.objectStore('sessions'));let data;req.onsuccess=()=>data=req.result;tx.oncomplete=()=>resolve(data);tx.onerror=()=>reject(tx.error||req.error);tx.onabort=()=>reject(tx.error||new Error('storage aborted'))})}

function updateSaveLabel(){const el=$('saveState');if(el)el.textContent=storageOkay?'已保存到此浏览器 · 未云同步':'仅此页面临时保留 · 请下载备份'}
function getAudioUrl(item){if(!audioUrls.has(item.id))audioUrls.set(item.id,URL.createObjectURL(item.blob));return audioUrls.get(item.id)}
function stopNativeAudio(){document.querySelectorAll('audio').forEach(a=>a.pause())}
function pauseRecording(){if(!isRecording())return;recordedSeconds+=(performance.now()-segmentStarted)/1000;recording.pause();if(mediaStream)mediaStream.getAudioTracks().forEach(t=>t.enabled=false);updateRecordUI()}
function stopSpeech(){speechToken++;if('speechSynthesis'in window)speechSynthesis.cancel();speechPaused=false;speechQueue=[];currentUtterance=null;document.querySelectorAll('.speaking').forEach(e=>e.classList.remove('speaking'));const label=$('speakingLabel');if(label)label.textContent='使用设备语音示范，不是官方录音';updateSpeechButtons()}
function updateSpeechButtons(){const b=$('speechPause');if(b){b.disabled=!currentUtterance;b.textContent=speechPaused?'继续示范':'暂停示范'}}
function playQueue(queue){if(!('speechSynthesis'in window)){notify('当前浏览器不支持语音示范，请用 Chrome 或 Safari 打开。');return}if(requestingMic){notify('正在请求麦克风，请稍后再播放。');return}if(isRecording()){pauseRecording();notify('录音已暂停。听完示范后，请手动点击“继续朗读”。')}stopNativeAudio();stopSpeech();const token=speechToken;speechQueue=queue;speechIndex=0;const run=()=>{if(token!==speechToken||speechIndex>=speechQueue.length){if(token===speechToken){currentUtterance=null;updateSpeechButtons();document.querySelectorAll('.speaking').forEach(e=>e.classList.remove('speaking'))}return}const item=speechQueue[speechIndex],u=new SpeechSynthesisUtterance(item.text);u.lang='en-GB';u.rate=rate;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.localService&&/^en[-_]GB/i.test(v.lang))||voices.find(v=>v.localService&&/^en/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;currentUtterance=u;let log=null;u.onstart=()=>{if(token!==speechToken)return;log={text:item.text,type:item.type||'句子',sentence:item.sentence,at:new Date().toISOString(),phase:stage,recordingCount:session.recordings.length,rate,completed:false};session.listens.push(log);persist();document.querySelectorAll('.speaking').forEach(e=>e.classList.remove('speaking'));if(Number.isInteger(item.sentence)){const sentence=document.querySelector('[data-sentence="'+item.sentence+'"]');if(sentence)sentence.classList.add('speaking')}const label=$('speakingLabel');if(label)label.textContent='示范播放中 · '+(u.voice&&u.voice.localService?'设备本地语音':'设备语音服务');updateSpeechButtons()};u.onend=()=>{if(token!==speechToken)return;if(log){log.completed=true;persist()}speechIndex++;run()};u.onerror=e=>{if(token!==speechToken)return;currentUtterance=null;updateSpeechButtons();if(e.error!=='canceled'&&e.error!=='interrupted')notify('示范未能播放。请检查设备声音或英语语音，稍后重试。')};speechSynthesis.speak(u);updateSpeechButtons()};run()}
function speakText(text,type='选区',sentence){playQueue([{text,type,sentence}])}
function pauseSpeech(){if(!currentUtterance)return;if(speechPaused){speechSynthesis.resume();speechPaused=false}else{speechSynthesis.pause();speechPaused=true}updateSpeechButtons()}
async function startRecording(){if(busy()){if(isPaused()){stopSpeech();stopNativeAudio();mediaStream.getAudioTracks().forEach(t=>t.enabled=true);recording.resume();segmentStarted=performance.now();updateRecordUI()}return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){notify('当前环境无法录音。请在 Chrome 中打开本机预览网址，或使用“查看演示流程”。');return}if(!$('consent')?.checked){notify('请先确认录音仅保存在此浏览器、家长视图可以回看。');return}stopSpeech();stopNativeAudio();requestingMic=true;updateRecordUI();try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));recording=new MediaRecorder(mediaStream,mime?{mimeType:mime}:{});const recorder=recording,chunks=[];recordedSeconds=0;recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{const seconds=recordedSeconds;const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;cancelAnimationFrame(levelFrame);if(audioContext){audioContext.close().catch(()=>{});audioContext=null}recording=null;if(blob.size){session.recordings.push({id:crypto.randomUUID(),created:new Date().toISOString(),seconds,blob,helpCount:session.listens.length});await persist();notify(storageOkay?'录音已保存到当前浏览器，可以回听。':'录音暂留在页面，请下载备份。')}else notify('没有录到有效音频，请重试。');const next=afterStop;afterStop=null;if(next){stage=next;render()}else render()};recorder.onerror=()=>{notify('录音中断，请回听已保存片段。');if(recorder.state!=='inactive')finishRecording()};recorder.start(1000);segmentStarted=performance.now();try{audioContext=new(window.AudioContext||window.webkitAudioContext)();analyser=audioContext.createAnalyser();analyser.fftSize=256;audioContext.createMediaStreamSource(mediaStream).connect(analyser);const data=new Uint8Array(analyser.fftSize);const level=()=>{if(!analyser)return;analyser.getByteTimeDomainData(data);let sum=0;for(const n of data)sum+=Math.pow((n-128)/128,2);const m=$('inputLevel');if(m)m.value=Math.min(1,Math.sqrt(sum/data.length)*6);levelFrame=requestAnimationFrame(level)};level()}catch(e){}notify('录音已开始，按自己的节奏读。')}catch(e){if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;notify(e.name==='NotAllowedError'?'麦克风权限未获允许。可在 Chrome 地址栏的网站设置中检查。':'未能开始录音：请确认麦克风可用后重试。')}finally{requestingMic=false;updateRecordUI()}}
function finishRecording(next){if(!recording)return;if(next)afterStop=next;if(isRecording())recordedSeconds+=(performance.now()-segmentStarted)/1000;if(recording.state!=='inactive')recording.stop();updateRecordUI()}
function updateRecordUI(){const start=$('recordStart'),pause=$('recordPause'),end=$('recordEnd'),state=$('recordState'),time=$('recordTime');if(start){start.disabled=requestingMic||isRecording();start.textContent=requestingMic?'请求麦克风…':isPaused()?'继续朗读':session.recordings.length?'再录一段':'开始录音'}if(pause)pause.disabled=!isRecording();if(end)end.disabled=!isRecording()&&!isPaused();if(state)state.textContent=isRecording()?'正在录音':isPaused()?'录音已暂停':session.recordings.length?'录音已保存':'准备好就开始';if(time)time.textContent=clock(recordedSeconds+(isRecording()?(performance.now()-segmentStarted)/1000:0))}
function articleMarkup(){let n=0;return ARTICLE.paragraphs.map((p,i)=>'<div class="paragraph"><span class="p-number">'+(i+1)+'</span><div>'+p.map(sentence=>{const index=n++;const words=sentence.split(/(\s+)/).map(w=>{if(/^\s+$/.test(w))return w;const key=cleanWord(w),mark=session.marks[key];let cls='word';if(mark)cls+=mark.kind==='疑似读音问题'?' mark-suspect':mark.kind==='识别不确定'?' mark-uncertain':' mark-unknown';if(selected?.word===key)cls+=' selected';return '<span class="'+cls+'" role="button" tabindex="0" data-word="'+escapeHtml(key)+'" data-sentence-index="'+index+'" aria-label="选择单词 '+escapeHtml(w)+'">'+escapeHtml(w)+'</span>'}).join('');return '<span class="sentence" data-sentence="'+index+'">'+words+'</span><button class="sentence-play" data-play-sentence="'+index+'" aria-label="播放第 '+(index+1)+' 句">听这句</button><button class="sentence-play" data-translate-sentence="'+index+'" aria-label="查看第 '+(index+1)+' 句翻译">译文</button> '}).join(' ')+'</div></div>').join('')}
function annotationMarkup(){const entries=Object.entries(session.marks);if(!entries.length)return '<p class="subtle">还没有确认的困难词。你可以点文章中的词来标记。</p>';return '<div class="annotation-list">'+entries.map(([word,m])=>'<div class="annotation-row"><div><strong>'+escapeHtml(word)+'</strong><small>'+escapeHtml(m.kind)+' · '+escapeHtml(m.source)+'</small></div><button class="quiet" data-select-mark="'+escapeHtml(word)+'">查看</button></div>').join('')+'</div>'}
function translationIndices(){if(!selected)return [];if(selected.sentences?.length)return selected.sentences;if(Number.isInteger(selected.sentence)&&selected.sentence>=0)return [selected.sentence];return SENTENCES.map((s,i)=>s.includes(selected.text)?i:-1).filter(i=>i>=0)}

function recordingMarkup(target=session){if(!target.recordings.length)return '<p class="subtle">'+(target.sample?'这是一条流程示例，没有真实录音。':'还没有保存的录音。')+'</p>';return target.recordings.map((r,i)=>'<div class="recording-item"><div class="row"><strong style="font-size:13px">'+(i===0?'首次录音':'后续片段 '+i)+' · '+clock(r.seconds)+'</strong><button data-download-audio="'+r.id+'">下载录音</button></div><audio controls preload="metadata" src="'+getAudioUrl(r)+'" data-recording-id="'+r.id+'"></audio></div>').join('')}
function comprehensionMarkup(){return '<div class="aside-section"><h3>一句话确认理解</h3><p>Why did the teacher choose a place under a tree?</p>'+['Because the shade made it comfortable.','Because students wanted to climb it.'].map((x,i)=>'<button class="choice '+(session.answer===i?'chosen':'')+'" data-answer="'+i+'">'+escapeHtml(x)+'</button>').join('')+(session.answer!==null?'<div class="feedback">'+(session.answer===0?'这个细节找对了。原文提到 shade（树荫）让空间更舒服。':'再看看第二段最后一句：The shade made the space more comfortable.')+'</div>':'')+'</div>'}
function render(){stopNativeAudio();$('studentNav').hidden=stage!=='parent';$('parentNav').hidden=stage==='parent';$('steps').hidden=stage==='parent';$('productName').textContent=stage==='parent'?'家长回看':'朗读预习';$('steps').querySelectorAll('li').forEach((li,i)=>li.classList.toggle('current',i===(stage==='read'?0:stage==='review'?1:2)));if(stage==='parent'){renderParent();return}if(stage==='finish'){renderFinish();return}$('main').innerHTML='<div class="workspace"><article><div class="eyebrow">'+(stage==='read'?'TODAY’S READING':'READ, NOTICE, TRY AGAIN')+'</div><h1>'+ARTICLE.title+'</h1><div class="article-toolbar"><div class="actions"><button id="playAll">听全文</button><button id="speechPause" disabled>暂停示范</button><button id="speechStop" class="quiet">停止</button><select id="speed" class="select-speed" aria-label="示范速度"><option value="1">正常 1×</option><option value="0.8">慢速 0.8×</option></select></div><div class="font-controls"><button id="fontDown" aria-label="缩小字体">小字</button><button id="fontUp" aria-label="放大字体">大字</button></div><div class="subtle full" id="speakingLabel">使用设备语音示范，不是官方录音</div></div>'+sampleAudioMarkup()+'<div class="passage" id="passage" style="--reading-size:'+fontSize+'px">'+articleMarkup()+'</div>'+(stage==='review'?'<div class="review-note">以下仅呈现你手动标记的内容。可载入模拟标注查看自动分析的交互示意。</div><button id="loadSampleMarks">载入模拟标注</button><div id="marksList">'+annotationMarkup()+'</div><h3>我的录音</h3>'+recordingMarkup(): '<p class="footnote">原创体验短文 · 约 130 词 · 英语预习材料，非 AEAS 官方试题</p>')+'</article><aside><div id="selectionPanel">'+selectedMarkup()+'</div>'+(stage==='read'?'<div class="aside-section"><label><input type="checkbox" id="consent"> 我知道：录音保存到本浏览器，家长演示视图也能回看。</label><p class="subtle">首次点击录音会请求麦克风权限。当前正在录制的片段，请结束录音后再关闭页面。</p><button id="sampleFlow" class="quiet">跳过录音，查看演示流程</button></div>':comprehensionMarkup())+'</aside></div>';
$('footer').innerHTML='<div class="bottom"><div><div class="record-info"><strong id="recordState">准备好就开始</strong><span id="recordTime">00:00</span><meter id="inputLevel" min="0" max="1" value="0" aria-label="麦克风输入音量"></meter></div><div class="status-line" id="saveState"></div></div><div class="actions">'+(stage==='read'?'<button id="recordStart" class="primary">开始录音</button><button id="recordPause">暂停</button><button id="recordEnd">读完了</button><button id="toReview" class="quiet">回看与练习</button>':'<button id="backRead">返回朗读 / 重读</button><button id="toFinish" class="primary">完成，今天到这里</button>')+'</div></div>';
bindCommon();$('speed').value=String(rate);$('speed').onchange=e=>{rate=Number(e.target.value);stopSpeech();notify('速度已调整，再次播放即可使用。')};$('playAll').onclick=()=>playQueue(SENTENCES.map((text,sentence)=>({text,sentence,type:'全文分句'})));$('speechPause').onclick=pauseSpeech;$('speechStop').onclick=stopSpeech;$('fontUp').onclick=()=>resizeFont(2);$('fontDown').onclick=()=>resizeFont(-2);bindArticle();bindSelection();if(stage==='read'){$('recordStart').onclick=startRecording;$('recordPause').onclick=pauseRecording;$('recordEnd').onclick=()=>finishRecording('review');$('toReview').onclick=()=>navigate('review');$('sampleFlow').onclick=()=>{if(busy()){notify('请先结束当前录音。');return}session.sample=true;session.marks={comfortable:{kind:'疑似读音问题',source:'模拟示例'},borrowed:{kind:'不懂词义',source:'模拟示例'},welcoming:{kind:'识别不确定',source:'模拟示例'}};stage='review';persist();render();notify('已载入流程示例，不是对你录音的分析。')}}else{$('backRead').onclick=()=>navigate('read');$('toFinish').onclick=async()=>{session.status='finished';await persist();navigate('finish')};$('loadSampleMarks').onclick=()=>{for(const[word,kind]of Object.entries({comfortable:'疑似读音问题',welcoming:'识别不确定'}))if(!session.marks[word])session.marks[word]={kind,source:'模拟示例'};persist();render();notify('模拟标注仅展示交互，不代表录音中存在这些问题。')};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{session.answer=Number(b.dataset.answer);persist();render()})}updateSaveLabel();updateRecordUI();updateSpeechButtons()}
function resizeFont(delta){fontSize=Math.min(28,Math.max(17,fontSize+delta));$('passage').style.setProperty('--reading-size',fontSize+'px')}
function bindArticle(){document.querySelectorAll('[data-word]').forEach(el=>{const choose=()=>{if(window.getSelection()?.toString().trim())return;selected={word:el.dataset.word,text:el.textContent,sentence:Number(el.dataset.sentenceIndex)};showMeaning=false;showTranslation=false;updateSelection()};el.onclick=choose;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected={word:el.dataset.word,text:el.textContent,sentence:Number(el.dataset.sentenceIndex)};showMeaning=false;showTranslation=false;updateSelection()}}});document.querySelectorAll('[data-play-sentence]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.playSentence);speakText(SENTENCES[i],'句子',i)});document.querySelectorAll('[data-translate-sentence]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.translateSentence);selected={text:SENTENCES[i],word:null,sentence:i};showMeaning=false;showTranslation=true;recordTranslation('句子',[i],SENTENCES[i]);updateSelection()});document.querySelectorAll('[data-select-mark]').forEach(b=>b.onclick=()=>{const word=b.dataset.selectMark;selected={word,text:word,sentence:SENTENCES.findIndex(s=>s.toLowerCase().includes(word))};showMeaning=false;showTranslation=false;updateSelection()})}
function updateSelection(){$('selectionPanel').innerHTML=selectedMarkup();document.querySelectorAll('[data-word]').forEach(el=>el.classList.toggle('selected',el.dataset.word===selected?.word));bindSelection()}
function bindSelection(){if(!selected)return;if($('translationBtn'))$('translationBtn').onclick=()=>{showTranslation=!showTranslation;if(showTranslation)recordTranslation('句子',translationIndices(),selected.text);updateSelection()};$('closeSelection').onclick=()=>{selected=null;updateSelection()};$('playSelected').onclick=()=>speakText(selected.text,selected.word?'单词':'选区',selected.sentence);if($('playContext'))$('playContext').onclick=()=>speakText(SENTENCES[selected.sentence],'句子',selected.sentence);document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{const key=selected.word||selected.text;session.marks[key]={kind:b.dataset.mark,source:'学生手动确认'};persist();notify('已记录：'+key+' · '+b.dataset.mark);refreshMarks()});if($('removeMark'))$('removeMark').onclick=()=>{delete session.marks[selected.word||selected.text];persist();refreshMarks()};if($('meaningBtn'))$('meaningBtn').onclick=()=>{showMeaning=!showMeaning;if(showMeaning)recordTranslation('单词',translationIndices(),selected.text);updateSelection()};if($('practiceDone'))$('practiceDone').onclick=()=>{const key=selected.word||selected.text;if(!session.practices.includes(key))session.practices.push(key);persist();notify('已记录练习，不代表已通过自动评测。')}}
function refreshMarks(){const article=$('passage');if(article){article.innerHTML=articleMarkup();bindArticle()}if($('marksList'))$('marksList').innerHTML=annotationMarkup();updateSelection();bindArticle()}
document.addEventListener('selectionchange',()=>{clearTimeout(window.tuweiSelectionTimer);window.tuweiSelectionTimer=setTimeout(()=>{const sel=window.getSelection(),passage=$('passage');if(!passage||!sel||sel.isCollapsed)return;if(!passage.contains(sel.anchorNode)||!passage.contains(sel.focusNode))return;const text=sel.toString().trim();if(!text||text.length>1600)return;const words=text.split(/\s+/);const range=sel.getRangeAt(0);const indices=Array.from(passage.querySelectorAll('[data-sentence]')).filter(el=>{try{return range.intersectsNode(el)}catch(e){return false}}).map(el=>Number(el.dataset.sentence));selected={text,word:words.length===1?cleanWord(text):null,sentence:indices.length===1?indices[0]:undefined,sentences:indices};showMeaning=false;showTranslation=false;updateSelection()},200)});
function navigate(next){if(requestingMic){notify('请等待麦克风请求完成。');return}stopSpeech();if(busy()){finishRecording(next);return}stage=next;selected=null;render();window.scrollTo(0,0)}
function bindCommon(){document.querySelectorAll('[data-download-sample]').forEach(b=>b.onclick=()=>{const item=AUDIO_SAMPLES.find(x=>x.voice===b.dataset.downloadSample);const bytes=Uint8Array.from(atob(item.data.split(',')[1]),c=>c.charCodeAt(0));downloadBlob(new Blob([bytes],{type:'audio/mpeg'}),item.file)});$('saveExit').hidden=stage==='parent';$('saveExit').onclick=async()=>{if(requestingMic){notify('请先完成麦克风请求。');return}stopSpeech();if(busy()){finishRecording('finish');return}const saved=await persist();navigate('finish');notify(saved?'已保存到当前浏览器，可以先结束今天的练习。':'保存失败，请先下载录音再关闭页面。')};document.querySelectorAll('audio').forEach(a=>{let sampleLog=null;a.addEventListener('ended',()=>{if(sampleLog){sampleLog.completed=true;persist()}});a.addEventListener('play',()=>{if(a.dataset.demoSample){sampleLog={type:'预生成示范试听 '+a.dataset.demoSample,text:SENTENCES.slice(0,5).join(' '),phase:stage,at:new Date().toISOString(),completed:false,rate:0.9};session.listens.push(sampleLog);persist()}stopSpeech();if(isRecording())pauseRecording();document.querySelectorAll('audio').forEach(other=>{if(other!==a)other.pause()})})});document.querySelectorAll('[data-download-audio]').forEach(b=>b.onclick=()=>downloadRecording(b.dataset.downloadAudio));$('parentNav').onclick=()=>{parentRecordId=session.id;navigate('parent')};$('studentNav').onclick=()=>navigate(session.status==='finished'?'finish':'read')}
function summaryText(target){const confirmed=Object.entries(target.marks).filter(([,m])=>m.source==='学生手动确认'&&['不懂词义','不会读'].includes(m.kind)).map(([w])=>w);return(target.sample?'这条记录含有模拟示例。':'本次保存了 '+target.recordings.length+' 段录音。')+(confirmed.length?'你确认需要帮助的地方是 '+confirmed.join('、')+'。':'暂时没有确认的困难词。')+' 当前 Demo 不会分析录音的发音、流利度或对错；模拟标注不能作为能力结论。'}
function renderFinish(){$('footer').innerHTML='';$('main').innerHTML='<section class="finish"><div class="eyebrow">ONE SMALL STEP, THEN BACK TO LIFE</div><h1>今天就到这里。</h1><p class="subtle">一篇文章，一次尝试。下次可以换个新句子，再看看是否更熟悉。</p><div class="stats"><div><strong>'+session.recordings.length+'</strong><span>已保存录音片段</span></div><div><strong>'+Object.keys(session.marks).length+'</strong><span>标记位置（含模拟示例）</span></div><div><strong>'+session.practices.length+'</strong><span>已记录练习位置</span></div></div><div class="summary"><span class="badge">G 的模拟反馈</span><p>'+escapeHtml(summaryText(session))+'</p><p>下次建议：选一个你确认不懂的词，先说说它在文章中的意思，再换一个新句子练习。</p></div><h3>今天的难度怎么样？</h3><div class="small-buttons">'+['太简单','刚刚好','有点难'].map(x=>'<button data-rating="'+x+'" class="'+(session.rating===x?'primary':'')+'">'+x+'</button>').join('')+'</div><div class="status-line top-gap" id="saveState"></div><div class="actions top-gap"><button id="finishParent" class="primary">查看家长记录</button><button id="finishReview">回看这篇</button><button id="newTry" class="quiet">重新尝试（主动选择）</button></div><p class="footnote">录音仅保存于此浏览器，清理浏览器数据会丢失。请下载需要长期保留的录音；正式云端长期保存尚未接入。</p></section>';bindCommon();$('finishParent').onclick=()=>{parentRecordId=session.id;navigate('parent')};$('finishReview').onclick=()=>navigate('review');$('newTry').onclick=()=>{session=makeSession();persist();navigate('read')};document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>{session.rating=b.dataset.rating;persist();renderFinish()});updateSaveLabel()}
function renderParent(){stopSpeech();$('footer').innerHTML='';const target=records.find(r=>r.id===parentRecordId)||session;const otherRecords=records.filter(r=>r.recordings.length||r.sample||Object.keys(r.marks).length||r.status==='finished');$('main').innerHTML='<section class="parent-layout"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">FAMILY READING JOURNAL</div><h1>朗读记录</h1></div><span class="pill">当前浏览器视图 · 非正式家长权限</span></div><p class="subtle">只有此浏览器的数据，没有云同步。录音默认保留至手动删除，但可能被浏览器清理；可随时下载备份。</p>'+(!otherRecords.length?'<div class="empty"><h2>还没有朗读记录</h2><p class="subtle">先完成一小段录音，再回来回听、看标记。</p><button id="emptyBack" class="primary">去读第一篇</button></div>':'<div class="row top-gap"><h2>'+ARTICLE.title+'</h2><span class="badge">'+(target.sample?'含流程示例':'本机记录')+'</span></div><p class="subtle">'+new Date(target.created).toLocaleString('zh-CN')+' · '+(target.status==='finished'?'已结束本次练习':'练习进行中')+' · 未云同步</p>'+recordingMarkup(target)+'<div class="parent-grid"><div><h2>这次遇到的地方</h2>'+parentMarks(target)+'<div class="aside-section"><h3>翻译帮助记录</h3><p class="subtle">本次主动查词或看译文 '+(target.translations||[]).length+' 次；查过不等于不会。</p><h3>示范接触记录</h3><p class="subtle">已开始播放 '+target.listens.length+' 次，其中完整播放 '+target.listens.filter(l=>l.completed).length+' 次。点读过不等于不会。</p>'+target.listens.slice(-5).map(l=>'<p class="subtle">'+escapeHtml(l.type)+' · '+escapeHtml(l.text.slice(0,95))+' · '+(l.completed?'播放完成':'未确认完整播放')+'</p>').join('')+'</div></div><div class="summary"><span class="badge">G 的模拟反馈</span><p>'+escapeHtml(summaryText(target))+'</p><h3>已记录的重点练习</h3><p>'+(target.practices.length?escapeHtml(target.practices.join('、')):'暂未记录。')+'</p><h3>理解确认</h3><p>'+((target.answer===null)?'尚未回答。':target.answer===0?'本题选择正确；不能据此推断整篇掌握。':'本题仍需回看原文。')+'</p><div class="actions"><button id="exportSummary">导出文字记录</button><button id="openDelete" class="danger">删除记录</button></div></div></div>')+'<h3 style="margin-top:38px">本机的其他尝试</h3>'+otherRecords.map(r=>'<div class="history-row"><div><strong>'+ARTICLE.title+'</strong><p class="subtle">'+new Date(r.created).toLocaleString('zh-CN')+' · '+r.recordings.length+' 段录音'+(r.sample?' · 含模拟数据':'')+'</p></div><button data-open-record="'+r.id+'">查看</button></div>').join('')+'<p class="footnote">这是原型中的角色切换，没有身份隔离，请勿将它当作已上线的家庭私密云盘。</p></section>';bindCommon();if($('emptyBack'))$('emptyBack').onclick=()=>navigate('read');if($('openDelete'))$('openDelete').onclick=()=>{deleteId=target.id;$('deleteDialog').showModal()};if($('exportSummary'))$('exportSummary').onclick=()=>exportRecord(target);document.querySelectorAll('[data-open-record]').forEach(b=>b.onclick=()=>{parentRecordId=b.dataset.openRecord;renderParent()});document.querySelectorAll('[data-parent-mark]').forEach(b=>b.onclick=()=>{const word=b.dataset.parentMark;const current=target.marks[word];const next=prompt('修正标记，可输入：不懂词义、不会读、识别不对、不确定。',current.kind);if(!next)return;if(!['不懂词义','不会读','识别不对','不确定'].includes(next)){notify('请选择列出的四种标记之一。');return}target.marks[word]={kind:next,source:'家长手动修正'};persist(target).then(()=>renderParent())})}
function parentMarks(target){const entries=Object.entries(target.marks);if(!entries.length)return '<p class="subtle">暂无标记；这不代表全部读对。</p>';return entries.map(([word,m])=>'<div class="annotation-row"><div><strong>'+escapeHtml(word)+'</strong><small>'+escapeHtml(m.kind)+' · '+escapeHtml(m.source)+'</small>'+(DICT[word]?'<small>'+escapeHtml(DICT[word].meaning)+'</small>':'')+'</div><button data-parent-mark="'+escapeHtml(word)+'">修正</button></div>').join('')}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function downloadRecording(id){for(const r of records){const item=r.recordings.find(x=>x.id===id);if(item){const ext=/mp4/.test(item.blob.type)?'m4a':'webm';downloadBlob(item.blob,'TUWEI_'+r.created.slice(0,10)+'_'+id.slice(0,8)+'.'+ext);return}}}
function exportRecord(target){const data={...target,recordings:target.recordings.map(({blob,...r})=>({...r,mimeType:blob.type,sizeBytes:blob.size})),note:'文字记录不含录音文件，录音请分别下载。自动反馈为演示。'};downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'TUWEI_Record_'+target.created.slice(0,10)+'.json')}
async function performDelete(onlyAudio){const target=records.find(r=>r.id===deleteId);if(!target)return;stopNativeAudio();try{if(onlyAudio){const old=target.recordings;target.recordings=[];const saved=await persist(target);if(!saved){target.recordings=old;throw new Error('not saved')}}else{if(db)await transact('readwrite',store=>store.delete(target.id));records=records.filter(r=>r.id!==target.id)}for(const[id,url]of audioUrls){URL.revokeObjectURL(url);audioUrls.delete(id)}if(!onlyAudio&&session.id===target.id){session=makeSession();await persist()}$('deleteDialog').close();parentRecordId=null;renderParent();notify(onlyAudio?'已删除本机录音，文字记录仍保留。':'已删除这条本机记录。')}catch(e){notify('删除未完成，请重试；未显示为已删除。')}}
$('deleteAudio').onclick=()=>performDelete(true);$('deleteAll').onclick=()=>performDelete(false);$('cancelDelete').onclick=()=>$('deleteDialog').close();
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopSpeech();if(isRecording()){pauseRecording();notify('页面离开前台，录音已暂停。返回后请手动继续。')}persist()}});
window.addEventListener('beforeunload',e=>{if(busy()){e.preventDefault();e.returnValue=''}});
let warned15=false;setInterval(()=>{updateRecordUI();if(session&&!document.hidden&&stage!=='parent'&&session.status!=='finished'){session.activeSeconds++;if(session.activeSeconds>=900&&!warned15){warned15=true;notify('今天可以先到这里。结束当前录音后，即可保存退出。')}}},1000);
(async()=>{try{db=await openDb();records=(await transact('readonly',s=>s.getAll())).sort((a,b)=>b.created.localeCompare(a.created));storageOkay=true}catch(e){storageOkay=false}session=records.find(r=>r.status==='draft')||makeSession();if(!records.some(r=>r.id===session.id))await persist();render();if(!storageOkay)notify('此环境无法持久保存。可体验流程，但请下载录音备份。');else if(records.some(r=>r.id===session.id))notify('已恢复上次保存在此浏览器的练习。')})();
</script>
