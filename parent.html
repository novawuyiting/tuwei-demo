function dateKey(value){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value))}
function hasActivity(r){return r.recordings.length||Object.keys(r.marks).length||r.listens.length||(r.translations||[]).length||r.activeSeconds>0||r.sample||Number.isInteger(r.answer)||(r.answers||[]).some(Number.isInteger)||Object.values(r.paragraphNotes||{}).some(note=>String(note).trim().length)}
function completionTime(r){return r.completedAt||r.created}
function realCompletions(){return records.filter(r=>r.status==='finished'&&!r.sample&&r.recordings.length)}
function progressData(now=new Date()){const today=dateKey(now),start=new Date(now.getFullYear(),now.getMonth(),now.getDate());start.setDate(start.getDate()-((start.getDay()+6)%7));const end=new Date(start);end.setDate(end.getDate()+7);const completed=realCompletions();return {today,start,completed,days:new Set(completed.map(r=>dateKey(completionTime(r)))),week:completed.filter(r=>new Date(completionTime(r))>=start&&new Date(completionTime(r))<end).length}}
function readingState(articleId=ARTICLE.id){const relevant=records.filter(r=>r.article===articleId&&!r.sample);const draft=relevant.find(r=>r.status==='draft'&&hasActivity(r));if(draft)return {label:'进行中',action:'继续阅读',record:draft};if(relevant.some(r=>r.status==='finished'&&r.recordings.length))return {label:'已完成',action:'再练一次',record:null};return {label:'未开始',action:'开始阅读',record:session?.article===articleId&&session.status==='draft'&&!session.sample?session:null}}

y);content='<div class="eyebrow">YOUR LEARNING JOURNAL</div><h1>每一次尝试，都有记录。</h1><p class="subtle">本机累计完成 '+p.completed.length+' 次阅读 · 默认日目标 1 篇，周目标 3 次</p><div class="dashboard-grid"><div class="panel">'+calendarMarkup()+'</div><div class="panel">'+weekMarkup()+'</div></div><h2 style="margin-top:32px">阅读记录</h2><div class="record-list">'+(list.length?list.map(r=>'<div class="history-row"><div><strong>'+escapeHtml(articleById(r.article).title)+'</strong><p class="subtle">'+new Date(completionTime(r)).toLocaleString('zh-CN')+' · '+(r.sample?'模拟流程 · 不计打卡':r.status==='finished'&&r.recordings.length?'已完成':'进行中')+' · '+r.recordings.length+' 段录音</p></div><button data-history-record="'+r.id+'">查看记录</button></div>').join(''):'<div class="empty"><p class="subtle">还没有训练记录，从第一篇阅读开始吧。</p><button data-open-reading class="primary">开始阅读</button></div>')+'</div>'} $('main').innerHTML='<section class="dashboard">'+content+'<p class="footnote">进度和录音仅保存在当前浏览器；换设备暂时不会同步。完成真实朗读训练后计入打卡，模拟流程不计入。</p></section>';bindCommon();document.querySelectorAll('[data-dashboard]').forEach(b=>b.onclick=()=>{if(b.dataset.dashboard==='training')trainingTab='reading';navigate(b.dataset.dashboard)});document.querySelectorAll('[data-open-reading]').forEach(b=>b.onclick=()=>openReading(b.dataset.openReading||'school-club-v1'));document.querySelectorAll('[data-training-tab]').forEach(b=>b.onclick=()=>{trainingTab=b.dataset.trainingTab;render()});if($('returnReading'))$('returnReading').onclick=()=>{trainingTab='reading';render()};if($('prevMonth'))$('prevMonth').onclick=()=>{calendarOffset--;render()};if($('nextMonth'))$('nextMonth').onclick=()=>{calendarOffset=Math.min(0,calendarOffset+1);render()};document.querySelectorAll('[data-history-record]').forEach(b=>b.onclick=()=>{parentRecordId=b.dataset.historyRecord;navigate('parent')})}

function statistics(records) {

 if(!api)throw Error('云同步尚未接通，学习仍保存在本机');const currentEpoch=epoch,token=identity?.token;

async function saved(record){if(record.sample||!identity)return;const b=record._cloudBinding;if(!same(b,binding()))return;

async function sync(){if(running||!identity||!api)return;running=true;const started=epoch;try{

  if(job.metadataStatus!=='synced'){
   const sent=job;const ack=await request('/records/'+job.record.id,{method:'PUT',data:{baseRevision:job.revision,mutationId:job.mutationId,data:metadataOf(job.record)}});
   await queue(async()=>{const latest=await store('jobs','readonly',s=>s.get(job.key));latest.revision=ack.revision;latest.receivedAt=ack.receivedAt;latest.metadataStatus=latest.localRevision===sent.localRevision?'synced':'pending';delete latest.error;await store('jobs','readwrite',s=>s.put(latest));});
  }

  for(const audio of job.record.recordings){if(started!==epoch)break;if(job.audio[audio.id]==='synced'||job.audio[audio.id]==='deleted')continue;
   try{if(!(audio.blob instanceof Blob))throw Error('本机音频缺失，请到原 iPad 补传');await request(`/records/${job.record.id}/audio/${audio.id}`,{method:'PUT',body:audio.blob,mime:audio.blob.type});job.audio[audio.id]='synced';}

  }
 }catch(e){await queue(async()=>{const latest=await store('jobs','readonly',s=>s.get(job.key));latest.error=e.message;if([409,410].includes(e.status))latest.blocked=true;await store('jobs','readwrite',s=>s.put(latest));});error=e.message;}
