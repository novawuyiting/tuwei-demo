<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#203630;background:#f5f7f4;--teal:#276b61;--muted:#748079;--line:#e1e7df}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px 16px;background:white;color:inherit}button:hover{border-color:#80aaa0;background:#edf4ef}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #79b6a7;outline-offset:3px}button.primary{background:var(--teal);color:white;border-color:var(--teal)}button.primary:hover{background:#20594f}button.quiet{border-color:transparent;background:transparent;color:var(--muted)}button.active{background:#e4eee7;border-color:#c5d9ce;color:var(--teal)}button:disabled{opacity:.5;cursor:default}a{color:var(--teal)}.preview{background:#203e35;color:#e8f0e9;font-size:12px;padding:9px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.preview button{padding:5px 12px;min-height:32px;font-size:12px;background:transparent;color:#e8f0e9;border-color:#547064}.preview button[aria-pressed=true]{background:#e8f0e9;color:#203e35}.preview span{opacity:.85}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}header{height:85px;padding:0 42px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-size:25px;font-weight:750;letter-spacing:-1px;color:var(--teal)}.brand small{font-size:19px;letter-spacing:1px;margin-left:8px}.tag{display:inline-block;font-size:11px;line-height:1.5;padding:5px 9px;border-radius:7px;background:#ecf1e9;color:#6b7d68;font-weight:550}.tag.done{background:#e1eee6;color:#276b61}.tag.draft{background:#fff0d6;color:#99702f}.muted{color:var(--muted);font-size:13px;line-height:1.8}h1{font-size:35px;font-weight:650;letter-spacing:-1px;margin:10px 0 12px;line-height:1.3}h2{font-size:22px;letter-spacing:-.4px;margin:0 0 16px}h3{font-size:16px;margin:0 0 9px}p{line-height:1.85}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--teal);font-weight:650}.shell{max-width:1180px;margin:auto;padding:35px 32px 70px}.notice{font-size:12px;padding:11px 15px;border:1px solid #e1e7d7;border-radius:9px;color:#6d7862;background:#f1f4e9;margin-bottom:28px}.layout{display:grid;grid-template-columns:210px 1fr;gap:38px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{text-align:left;border-color:transparent;background:transparent;display:flex;justify-content:space-between;align-items:center}.nav button.selected{background:#e3ece3;color:var(--teal);font-weight:600}.nav small{font-size:10px;color:var(--muted)}.profile{padding:18px 14px;border-bottom:1px solid var(--line);margin-bottom:15px}.avatar{width:38px;height:38px;border-radius:50%;background:#dae8d7;display:grid;place-items:center;color:#4a6b4e;font-size:15px}.profile strong{display:block;font-size:14px}.profile span{font-size:11px;color:var(--muted)}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:23px;display:flex;flex-direction:column;gap:10px;min-width:0}.card h3{font-size:19px;font-weight:600;line-height:1.45;letter-spacing:-.3px;margin:4px 0}.card p{margin:0}.card .action{margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.card .action button{padding:8px 12px;font-size:13px}.card-number{color:#a0aca0;font-size:12px;letter-spacing:1px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px 20px}.stat b{display:block;font-size:28px;font-weight:550;letter-spacing:-1px;color:var(--teal);margin-bottom:6px}.stat span{font-size:12px;color:var(--muted)}.hero{background:#e6eee2;border:1px solid #d6e2d0;border-radius:16px;padding:27px 29px;display:flex;align-items:center;justify-content:space-between;gap:22px;margin-bottom:27px}.hero h2{margin:7px 0 8px;font-size:24px}.hero p{margin:0;font-size:13px;color:#60765d}.filters{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}.filters button{font-size:12px;min-height:34px;padding:7px 13px}.login{max-width:1050px;min-height:600px;margin:0 auto;display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:75px;padding:55px 32px}.login h1{font-size:46px;line-height:1.35;letter-spacing:-1.5px}.login .intro{max-width:350px}.login-box{padding:36px;background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:0 14px 45px #23483408}.login-box h2{margin:0 0 5px}.login-box label{display:block;margin-top:21px;font-size:13px;font-weight:550}.login-box input{display:block;width:100%;margin-top:9px;border:1px solid #d8e0d6;border-radius:9px;padding:13px 14px;background:#fafbf8;min-height:46px}.login-box button.primary{width:100%;margin-top:25px}.login-hint{font-size:11px;line-height:1.8;color:var(--muted);margin:20px 0 0}.book{height:146px;display:flex;align-items:end;gap:12px;margin:42px 0 0}.book i{display:block;width:45px;border:1px solid #b4c9ad;border-radius:5px 8px 2px 2px;background:#dce8d3;position:relative}.book i:after{content:'';position:absolute;left:9px;right:9px;top:18px;border-top:1px solid #a3ba99}.book i:nth-child(1){height:111px;transform:rotate(-9deg)}.book i:nth-child(2){height:140px;background:#71977b;border-color:#71977b}.book i:nth-child(3){height:120px;background:#d6ceb7;border-color:#c7bfa7;transform:rotate(7deg);margin-left:6px}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:26px;margin-top:18px}.back{padding-left:0;margin-bottom:15px}.detail-head{margin-bottom:22px}.detail-head h1{font-size:31px;max-width:680px}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:28px 0 20px}.tabs button{border:0;border-radius:0;background:transparent;padding:10px 0 14px;color:var(--muted)}.tabs button[aria-selected=true]{border-bottom:2px solid var(--teal);color:var(--teal)}.detail-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.detail-grid .panel{margin:0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:19px}.facts dt{font-size:11px;color:var(--muted);margin-bottom:6px}.facts dd{margin:0;font-size:14px}.timeline{padding:16px 0;border-top:1px solid var(--line)}.timeline:first-of-type{border-top:0}.timeline strong{font-size:14px}.audio-row{display:flex;gap:15px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.play{border-radius:50%;width:43px;min-width:43px;min-height:43px;padding:0}.audio-row p{margin:0}.audio-row small{color:var(--muted)}audio{width:100%;margin-top:15px}blockquote{border-left:3px solid #9dbba5;margin:15px 0;padding:8px 15px;font-size:14px;background:#f4f7f1;line-height:1.8}.passage p{font-size:18px;line-height:2.05;margin:0 0 24px}.passage p small{font-size:12px;color:#99a99a;margin-right:12px}.recordbar{position:sticky;bottom:16px;padding:18px 22px;border:1px solid #cbdbce;background:#f4f8f1f5;backdrop-filter:blur(10px);border-radius:13px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 8px 24px #12331912;margin-top:20px}.recordbar strong{font-variant-numeric:tabular-nums;font-weight:550;font-size:21px}.red{color:#ad5349}.choice{display:block;text-align:left;width:100%;margin:8px 0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#203e35;color:white;padding:13px 20px;border-radius:10px;z-index:5;font-size:13px}.toast:empty{display:none}.hidden{display:none}.full{width:100%}select{border:1px solid var(--line);background:white;border-radius:8px;padding:9px;min-height:43px}.review-note{border:1px dashed #cad6c5;border-radius:12px;padding:20px;margin-top:25px;font-size:13px;color:var(--muted);line-height:1.9}@media(max-width:900px){.layout{grid-template-columns:150px 1fr;gap:22px}.cards{grid-template-columns:1fr}.login{gap:35px}.login h1{font-size:37px}.detail-grid{grid-template-columns:1fr}}@media(max-width:650px){header{height:70px;padding:0 20px}.brand{font-size:21px}.preview{padding:9px 16px}.shell{padding:24px 18px 65px}.layout{display:block}.nav{flex-direction:row;gap:0;margin:0 0 25px;overflow:auto}.nav button{white-space:nowrap}.nav .profile{display:none}.nav small{display:none}.login{display:block;padding:35px 22px}.login h1{font-size:32px}.login .intro{max-width:none}.book{display:none}.login-box{margin-top:30px;padding:25px}.hero{padding:23px;align-items:flex-start;flex-direction:column}.stats{gap:8px}.stat{padding:15px 11px}.stat b{font-size:25px}.stat span{font-size:11px}h1{font-size:28px}.card{padding:21px}.tabs{gap:17px}.recordbar{align-items:flex-start;flex-wrap:wrap}.recordbar button{font-size:12px;padding:10px}.facts{gap:15px}.detail-head h1{font-size:27px}}
.brand{white-space:nowrap}@media(max-width:650px){#headerUser{flex-wrap:nowrap;gap:6px}#headerUser>.muted{display:none}.brand{font-size:20px}.brand small{font-size:16px;margin-left:5px}header{gap:10px}}
</style>
<div class="preview"><div><strong>首页结构 Demo</strong><span> · 所有练习数据均为示例</span></div><div class="row"><button data-preview="login">未登录</button><button data-preview="student">学生首页</button><button data-preview="parent">家长首页</button></div></div>
<header><div class="brand">突围 <small>AEAS</small></div><div id="headerUser" class="row"><span class="muted">每天一点新发现</span></div></header>
<main id="app"></main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="home-demo-data.js"></script>
<script>
const lessons=window.DEMO_LESSONS,app=document.getElementById('app');
let role='login',page='home',selected=0,filter='all',tab='overview',attempt=0,recording='idle',seconds=0,difficulty='',answer=null,toastTimer;
let attempts=[{article:0,date:'11 月 4 日',started:'19:35',ended:'19:50',duration:'15 分钟',rating:'刚刚好'},{article:0,date:'11 月 3 日',started:'19:30',ended:'19:43',duration:'13 分钟',rating:'有点难'},{article:1,date:'11 月 3 日',started:'18:00',ended:'18:14',duration:'14 分钟',rating:'刚刚好'}];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=i=>attempts.some(a=>a.article===i)?'done':i===2?'draft':'new';
const label=i=>({done:'已完成',draft:'进行中',new:'未开始'}[status(i)]);
const toast=s=>{document.getElementById('toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',3500)};
function navigate(next){role=next;page='home';recording='idle';render();window.scrollTo(0,0)}
function stats(){const distinct=new Set(attempts.map(x=>x.article)),days=new Set(attempts.map(x=>x.date));return `<div class="stats"><div class="stat"><b>${distinct.size}<small style="font-size:13px;color:#8a998a"> / 8</small></b><span>已读不同文章</span></div><div class="stat"><b>${days.size}</b><span>北京时间打卡天数</span></div><div class="stat"><b>${attempts.length-distinct.size}</b><span>重练次数</span></div></div>`}
function nav(){return `<aside class="nav"><div class="profile row"><div class="avatar">${role==='parent'?'家':'付'}</div><div><strong>${role==='parent'?'家长视角':'付意游'}</strong><span>${role==='parent'?'付意游的学习档案':'学生 · 阅读计划'}</span></div></div><button class="selected" data-home>阅读训练 <span>↗</span></button><button disabled>单词训练 <small>即将开放</small></button><button disabled>小测试 <small>即将开放</small></button><button data-journal>学习记录</button></aside>`}
function wrap(body){return `<div class="shell"><div class="notice">结构预览 · 以下进度、录音状态和作答均为演示数据，不代表付意游的实际学习情况。</div><div class="layout">${nav()}<section>${body}</section></div></div>`}
function login(){return `<section class="login"><div class="intro"><div class="eyebrow">ONE SMALL STEP, EVERY DAY</div><h1>读一点新故事，<br>多一点新发现。</h1><p class="muted">从一篇文章开始。<br>学生在这里阅读与朗读，家长在这里看见每一次尝试。</p><div class="book" aria-hidden="true"><i></i><i></i><i></i></div></div><div class="login-box"><h2>欢迎回来</h2><p class="muted">登录后，自动进入你的学习或家长首页。</p><form id="loginForm"><label>账号<input id="demoAccount" autocomplete="off" placeholder="演示账号：student 或 parent" required></label><label>密码<input type="password" autocomplete="off" placeholder="演示可留空，无需真实密码"></label><button class="primary" type="submit">进入演示 →</button></form><p class="login-hint">此页只确认页面结构，不验证账号、不连接云端。<br>也可以点击顶部“学生首页 / 家长首页”直接预览。</p></div></section>`}
function card(l,i){return `<article class="card"><div class="row between"><span class="card-number">READING ${String(i+1).padStart(2,'0')}</span><span class="tag ${status(i)}">${label(i)}</span></div><h3>${esc(l.title)}</h3><p class="muted">${esc(l.description)}</p><div class="row"><span class="tag">${esc(l.topic)}</span><span class="muted">约 15 分钟</span></div><div class="action"><span class="muted">${role==='parent'?(status(i)==='done'?`${attempts.filter(a=>a.article===i).length} 次练习 · 查看录音与作答`:status(i)==='draft'?'已开始 · 尚未完成':'尚无练习记录'):(status(i)==='done'?'已完成，可回看或再练一次':status(i)==='draft'?'从上次停下的地方继续':'先读，再按需查词')}</span><button class="${role==='student'&&status(i)!=='done'?'primary':''}" data-article="${i}">${role==='parent'?'查看详情':status(i)==='done'?'回看 / 重练':status(i)==='draft'?'继续阅读':'开始阅读'} →</button></div></article>`}
function home(){return wrap(`<div class="eyebrow">${role==='parent'?'FAMILY LEARNING JOURNAL':'YOUR DAILY READING'}</div><h1>${role==='parent'?'看看付意游最近读了什么。':'今天，读一点新故事。'}</h1><p class="muted">${role==='parent'?'文章、练习与每一次朗读，放在同一份学习档案里。':'选一篇感兴趣的文章，按自己的节奏来。'}</p>${stats()}${role==='student'?`<div class="hero"><div><div class="eyebrow">CONTINUE YOUR STORY</div><h2>Great fun at Camp Gorra!</h2><p>上次读到露营活动 · 继续这一篇就好</p></div><button class="primary" data-article="2">继续阅读 →</button></div>`:`<div class="hero"><div><div class="eyebrow">LATEST PRACTICE · 示例</div><h2>A Different Kind of School Club</h2><p>11 月 4 日 · 已完成 · 难度反馈：刚刚好</p></div><button data-article="0">查看本次练习 →</button></div>`}<div class="row between"><h2 style="margin:0">阅读训练</h2><span class="muted">8 篇文章</span></div><div class="filters">${[['all','全部'],['new','未开始'],['draft','进行中'],['done','已完成']].map(([v,n])=>`<button data-filter="${v}" class="${filter===v?'active':''}">${n}</button>`).join('')}</div><div class="cards">${lessons.map((l,i)=>filter==='all'||status(i)===filter?card(l,i):'').join('')}</div><div class="review-note">待确认的首页结构：两端共享文章列表，学生进入阅读与录制，家长进入该篇练习详情。单词和测试暂时保留入口。</div>`)}
function parentDetail(){const l=lessons[selected],list=attempts.filter(a=>a.article===selected),r=list[attempt]||list[0];let body='';if(!r)body=`<div class="panel"><h2>${status(selected)==='draft'?'练习进行中':'还没有这篇的练习记录'}</h2><p class="muted">${status(selected)==='draft'?'可以先显示已保存的开始时间、查词与录音上传状态；完成后再计入打卡。':'付意游开始练习后，时间、录音和练习数据会集中显示在这里。'}</p><button data-back>返回文章列表</button></div>`;else{const overview=`<div class="detail-grid"><section class="panel"><h3>本次练习</h3><dl class="facts"><div><dt>开始时间 · 北京时间</dt><dd>${r.date} ${r.started}</dd></div><div><dt>完成时间 · 北京时间</dt><dd>${r.date} ${r.ended}</dd></div><div><dt>学习用时</dt><dd>${r.duration}</dd></div><div><dt>学生难度反馈</dt><dd>${r.rating}</dd></div><div><dt>学习记录同步</dt><dd>已同步 · 示例</dd></div><div><dt>录音同步</dt><dd>1 段已上传，1 段待重试 · 示例</dd></div></dl></section><section class="panel"><h3>本次留下的线索</h3><div class="timeline"><strong>3 个困难词标记</strong><p class="muted">different · describe · together</p></div><div class="timeline"><strong>2 次查词 / 翻译</strong><p class="muted">显示查过什么、何时查看，不将查词等同于没掌握。</p></div><div class="timeline"><strong>2 道理解题与段落概括</strong><p class="muted">可以展开查看所选答案和原文依据。</p></div></section></div>`;
const audio=`<section class="panel"><h3>这次的朗读</h3><p class="muted">下列状态为示例。演示回听使用文章示范音频，非学生录音。</p><div class="audio-row"><button class="play" id="playExample" aria-label="播放示例音频">▶</button><div><h3>第一次朗读</h3><small>示例片段 · 已上传，可回听</small></div></div><audio id="exampleAudio" controls preload="none" src="audio/TUWEI_School_Club_Natasha.mp3"></audio><div class="audio-row"><button class="play" disabled aria-label="录音尚未上传">↥</button><div><h3>再试一次</h3><small>示例片段 · 待重试上传 · 学习记录已保留</small></div></div><p class="muted">建议保留每一次尝试，而不是只保留最后一遍。</p></section>`;
const practice=`<section class="panel"><h3>困难词、查词与翻译</h3><p><span class="tag draft">different · 不懂词义</span> <span class="tag">describe · 不会读</span> <span class="tag">together · 不确定</span></p><p class="muted">示例：19:38 查询 describe；19:41 查看句子译文。</p><h3 style="margin-top:28px">理解题与原文依据</h3><p>${esc(l.questions[0]?.prompt||'示例理解题')}</p><p class="muted">所选答案：${esc(l.questions[0]?.options[1]||'示例答案')}</p><blockquote>${esc(l.paragraphs.flat()[7]||l.paragraphs.flat()[0])}</blockquote><h3 style="margin-top:28px">段落概括</h3><p class="muted">示例：两个人兴趣不同，但可以用各自的方式观察同一件事。</p></section>`;
body=`<div class="row between"><label class="muted">查看哪一次练习 <select id="attemptSelect">${list.map((a,i)=>`<option value="${i}" ${attempt===i?'selected':''}>${a.date} · ${a.started} · ${i===0?'最近一次':'更早一次'}</option>`).join('')}</select></label><span class="tag done">已完成 · 示例</span></div><div class="tabs" role="tablist">${[['overview','练习概览'],['audio','录音回听'],['practice','练习数据']].map(([v,n])=>`<button role="tab" aria-selected="${tab===v}" data-tab="${v}">${n}</button>`).join('')}</div>${tab==='overview'?overview:tab==='audio'?audio:practice}`;}return wrap(`<button class="quiet back" data-back>← 返回阅读训练</button><div class="detail-head"><div class="eyebrow">PARENT VIEW · 家长查看</div><h1>${esc(l.title)}</h1><p class="muted">${esc(l.description)}</p></div>${body}`)}
function studentDetail(){const l=lessons[selected];return wrap(`<button class="quiet back" data-back>← 返回阅读训练</button><div class="detail-head"><div class="eyebrow">STUDENT VIEW · 学生阅读</div><h1>${esc(l.title)}</h1><p class="muted">先自己读一遍，需要时再打开帮助。${status(selected)==='done'?'这篇已读过，可以回看或重新尝试。':''}</p></div><section class="panel passage">${l.paragraphs.map((p,i)=>`<p><small>${String(i+1).padStart(2,'0')}</small>${esc(p.join(' '))}</p>`).join('')}<details><summary class="muted">需要帮助时再展开：示范与词句帮助</summary><p class="muted" style="font-size:13px">正式版本保留现有的选词查义、翻译、整篇朗读和句子点读交互。</p><audio controls preload="none" src="audio/TUWEI_School_Club_Natasha.mp3"></audio><p class="muted" style="font-size:11px">Demo 使用 School Club 示范音频。</p></details></section><div class="recordbar"><div><div class="muted">${recording==='recording'?'<span class="red">● 模拟录制中</span>':recording==='paused'?'模拟录制已暂停':recording==='saved'?'模拟片段已生成':'准备好就开始朗读'}</div><strong id="clock">${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}</strong></div><div class="row">${recording==='idle'||recording==='saved'?'<button class="primary" id="startRecord">开始模拟录音</button>':`<button id="pauseRecord">${recording==='paused'?'继续':'暂停'}</button><button class="primary" id="stopRecord">结束这段</button>`}<button id="showFeedback">去练习与反馈 →</button></div></div><p class="muted" style="font-size:11px">演示操作：不调用麦克风，不保存录音或学习记录。</p><section class="panel ${recording==='saved'?'':'hidden'}" id="studentFeedback"><h3>读完以后，想一想</h3>${l.questions[0]?`<p>${esc(l.questions[0].prompt)}</p>${l.questions[0].options.map((o,i)=>`<button class="choice ${answer===i?'active':''}" data-answer="${i}">${esc(o)}</button>`).join('')}`:''}<h3 style="margin-top:24px">这篇的难度怎么样？</h3><div class="row">${['太简单','刚刚好','有点难'].map(v=>`<button class="${difficulty===v?'active':''}" data-rating="${v}">${v}</button>`).join('')}</div><button class="primary" id="finishDemo" style="margin-top:25px">完成本次演示</button><p class="muted" style="font-size:11px">仅更新这次预览中的示例状态，不计入真实打卡。</p></section>`)}
function render(){document.querySelectorAll('[data-preview]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.preview===role)));document.getElementById('headerUser').innerHTML=role==='login'?'<span class="muted">每天一点新发现</span>':`<span class="tag">${role==='parent'?'家长':'学生'}</span><span class="muted">${role==='parent'?'付意游的学习档案':'你好，付意游'}</span><button class="quiet" id="logout">退出演示</button>`;app.innerHTML=role==='login'?login():page==='home'?home():role==='parent'?parentDetail():studentDetail();bind()}
function bind(){const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};on('logout',()=>navigate('login'));const form=document.getElementById('loginForm');if(form)form.onsubmit=e=>{e.preventDefault();const value=document.getElementById('demoAccount').value.trim().toLowerCase();if(value!=='parent'&&value!=='student'){toast('演示请填写 student 或 parent，或使用顶部预览按钮。');return}navigate(value)};
document.querySelectorAll('[data-home],[data-back]').forEach(b=>b.onclick=()=>{page='home';render();window.scrollTo(0,0)});document.querySelectorAll('[data-journal]').forEach(b=>b.onclick=()=>{page='home';filter='done';render()});document.querySelectorAll('[data-article]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.article);page='detail';tab='overview';attempt=0;recording='idle';seconds=0;answer=null;difficulty='';render();window.scrollTo(0,0)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});const sel=document.getElementById('attemptSelect');if(sel)sel.onchange=()=>{attempt=Number(sel.value);render()};on('playExample',()=>document.getElementById('exampleAudio').play().catch(()=>toast('请使用下方音频控件播放。')));on('startRecord',()=>{seconds=0;recording='recording';render()});on('pauseRecord',()=>{recording=recording==='paused'?'recording':'paused';render()});on('stopRecord',()=>{recording='saved';render();toast('已生成模拟片段，仅用于预览')});on('showFeedback',()=>{document.getElementById('studentFeedback').classList.remove('hidden');document.getElementById('studentFeedback').scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>{difficulty=b.dataset.rating;document.querySelectorAll('[data-rating]').forEach(e=>e.classList.toggle('active',e.dataset.rating===difficulty))});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answer=Number(b.dataset.answer);document.querySelectorAll('[data-answer]').forEach(e=>e.classList.toggle('active',Number(e.dataset.answer)===answer))});on('finishDemo',()=>{if(recording!=='saved'){toast('请先完成一段模拟录音，再完成演示。');return}attempts.unshift({article:selected,date:'本次演示',started:'示例',ended:'示例',duration:'演示用时',rating:difficulty||'未反馈'});recording='idle';page='home';render();window.scrollTo(0,0);toast('示例已完成；切到家长首页可查看这次演示')})}
document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>navigate(b.dataset.preview));setInterval(()=>{if(recording==='recording'&&role==='student'&&page==='detail'){seconds++;const c=document.getElementById('clock');if(c)c.textContent=Math.floor(seconds/60).toString().padStart(2,'0')+':'+(seconds%60).toString().padStart(2,'0')}},1000);render();
</script>
</html>
